<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Название сайта</title>
<style>
  /* ===== Базовые сбросы и переменные ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f7f5f0;          /* тёплый светлый фон */
    --text: #1c1c1c;        /* почти чёрный */
    --muted: #6b6b6b;       /* серый для второстепенного */
    --accent: #8a6d3b;      /* благородный золотисто-коричневый */
    --border: #e0dcd3;      /* тонкая линия */
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: "Georgia", "Times New Roman", serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  /* ===== ШАПКА ===== */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: rgba(247, 245, 240, 0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    z-index: 100;
  }

  /* Кнопка-гамбургер */
  .burger {
    width: 42px;
    height: 42px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    border-radius: 6px;
    transition: background 0.2s ease;
  }
  .burger:hover { background: rgba(0, 0, 0, 0.05); }
  .burger span {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--text);
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  /* Анимация в крестик когда открыто (для мобильных) */
  .burger.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .burger.active span:nth-child(2) { opacity: 0; }
  .burger.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* Название по центру */
  .site-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
  }

  /* Кнопка поиска */
  .search-btn {
    width: 42px;
    height: 42px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transition: background 0.2s ease;
  }
  .search-btn:hover { background: rgba(0, 0, 0, 0.05); }
  .search-btn svg {
    width: 20px;
    height: 20px;
    stroke: var(--text);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
  }

  /* ===== ВЫДВИЖНОЕ МЕНЮ (шторка слева) ===== */
  .drawer {
    position: fixed;
    top: 0; left: 0;
    width: 300px;
    max-width: 85vw;
    height: 100%;
    background: #ffffff;
    box-shadow: var(--shadow);
    transform: translateX(-100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 200;
    display: flex;
    flex-direction: column;
    padding: 90px 0 24px 0;
  }
  .drawer.open { transform: translateX(0); }

  .drawer nav {
    flex: 1;
    overflow-y: auto;
  }
  .drawer nav a {
    display: block;
    padding: 16px 32px;
    color: var(--text);
    text-decoration: none;
    font-size: 18px;
    border-left: 3px solid transparent;
    transition: all 0.2s ease;
  }
  .drawer nav a:hover {
    background: var(--bg);
    border-left-color: var(--accent);
    padding-left: 38px;
  }

  .drawer .contacts {
    padding: 16px 24px 0 24px;
    border-top: 1px solid var(--border);
  }
  .drawer .contacts a {
    display: block;
    text-align: center;
    padding: 14px;
    background: var(--text);
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 6px;
    transition: background 0.2s ease;
  }
  .drawer .contacts a:hover { background: var(--accent); }

  /* Затемнение под шторкой */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    z-index: 150;
  }
  .overlay.show { opacity: 1; visibility: visible; }

  /* ===== МОДАЛЬНОЕ ОКНО ПОИСКА ===== */
  .search-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 120px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
    z-index: 300;
  }
  .search-modal.show { opacity: 1; visibility: visible; }

  .search-box {
    background: #fff;
    width: 90%;
    max-width: 600px;
    border-radius: 10px;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
    transform: translateY(-20px);
    transition: transform 0.3s ease;
  }
  .search-modal.show .search-box { transform: translateY(0); }

  .search-box svg {
    width: 20px; height: 20px;
    stroke: var(--muted); fill: none;
    stroke-width: 2; stroke-linecap: round;
    flex-shrink: 0;
  }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 18px;
    font-family: inherit;
    background: transparent;
    color: var(--text);
  }
  .search-box input::placeholder { color: var(--muted); }

  /* ===== ГЛАВНАЯ СТРАНИЦА ===== */
  main {
    min-height: 100vh;
    padding-top: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Большое название по центру */
  .hero-title {
    font-size: clamp(40px, 9vw, 130px);
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-align: center;
    position: relative;
    z-index: 5;
    padding: 0 20px;
    animation: fadeIn 1.2s ease 0.3s both;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Фотографии по бокам */
  .side-photo {
    position: absolute;
    top: 50%;
    width: clamp(180px, 22vw, 340px);
    aspect-ratio: 3 / 4;
    background: #d9d4c9;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: var(--shadow);
    z-index: 1;
  }
  .side-photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  
  .side-photo::after {
    content: "";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9a9285;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
  }

  .side-photo.left {
    left: 3vw;
    transform: translate(-150%, -50%);
    animation: slideInLeft 1.1s cubic-bezier(0.2, 0.9, 0.3, 1) 0.1s forwards;
  }
  .side-photo.right {
    right: 3vw;
    transform: translate(150%, -50%);
    animation: slideInRight 1.1s cubic-bezier(0.2, 0.9, 0.3, 1) 0.1s forwards;
  }

  @keyframes slideInLeft {
    to { transform: translate(0, -50%); }
  }
  @keyframes slideInRight {
    to { transform: translate(0, -50%); }
  }

  /* ===== Адаптив ===== */
  @media (max-width: 768px) {
    .site-title { font-size: 16px; letter-spacing: 2px; }

    .side-photo {
      width: 42vw;
      aspect-ratio: 3 / 4;
      opacity: 0.85;
    }
    .side-photo.left { left: 2vw; }
    .side-photo.right { right: 2vw; }

    .hero-title {
      font-size: clamp(34px, 12vw, 60px);
      letter-spacing: 2px;
    }

    .search-box { padding: 16px; }
    .search-box input { font-size: 16px; }
  }

  @media (max-width: 480px) {
    .side-photo {
      width: 38vw;
      top: 30%;
    }
    .side-photo.right { top: 72%; }
    .side-photo.left  { top: 30%; }
  }
</style>
</head>
<body>

  <!-- ===== ШАПКА ===== -->
  <header>
    <button class="burger" id="burger" aria-label="Меню">
      <span></span><span></span><span></span>
    </button>

    <div class="site-title"><!-- ВСТАВЬ НАЗВАНИЕ -->Название</div>

    <button class="search-btn" id="searchBtn" aria-label="Поиск">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    </button>
  </header>

  <!-- ===== ВЫДВИЖНОЕ МЕНЮ ===== -->
  <aside class="drawer" id="drawer">
    <nav>
      <a href="#">9й класс</a>
      <a href="#">8й класс</a>
      <a href="#">7й класс</a>
      <a href="#">6й класс</a>
      <a href="#">5й класс</a>
    </nav>
    <div class="contacts">
      <a href="https://wertyt2332.github.io/contacs">Контакты</a>
    </div>
  </aside>

  <!-- Затемнение -->
  <div class="overlay" id="overlay"></div>

  <!-- ===== МОДАЛЬНОЕ ОКНО ПОИСКА ===== -->
  <div class="search-modal" id="searchModal">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input type="text" placeholder="Поиск по сайту..." id="searchInput" autocomplete="off">
    </div>
  </div>

  <!-- ===== ГЛАВНАЯ ===== -->
  <main>
    <div class="side-photo left">
    <img src="https://i.pinimg.com/736x/e8/5d/b1/e85db1e5e5b19edf225f41cc613e1e06.jpg" alt="">
    </div>

    <h1 class="hero-title">Название</h1>

    <div class="side-photo right">
    <img src="https://www.kino-teatr.ru/acter/album/3316/1356.jpg" alt="">
    </div>
  </main>

<script>
  const burger     = document.getElementById('burger');
  const drawer     = document.getElementById('drawer');
  const overlay    = document.getElementById('overlay');
  const searchBtn  = document.getElementById('searchBtn');
  const searchModal= document.getElementById('searchModal');
  const searchInput= document.getElementById('searchInput');

  /* --- Открытие/закрытие меню --- */
  function openDrawer() {
    drawer.classList.add('open');
    overlay.classList.add('show');
    burger.classList.add('active');
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    overlay.classList.remove('show');
    burger.classList.remove('active');
  }
  burger.addEventListener('click', () => {
    drawer.classList.contains('open') ? closeDrawer() : openDrawer();
  });
  overlay.addEventListener('click', closeDrawer);

  /* --- Поиск --- */
  function openSearch() {
    searchModal.classList.add('show');
    setTimeout(() => searchInput.focus(), 150);
  }
  function closeSearch() {
    searchModal.classList.remove('show');
    searchInput.value = '';
  }
  searchBtn.addEventListener('click', openSearch);
  searchModal.addEventListener('click', (e) => {
    if (e.target === searchModal) closeSearch();
  });

  /* --- Esc закрывает всё --- */
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeDrawer();
      closeSearch();
    }
  });
</script>

</body>
</html>
