<title>Название сайта</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg: #f7f5f0; --text: #1c1c1c; --muted: #6b6b6b; --accent: #8a6d3b; --border: #e0dcd3; --shadow: 0 10px 30px rgba(0,0,0,0.12); --ease: cubic-bezier(0.4,0,0.2,1); }
  html, body { height: 100%; }
  body { font-family: "Georgia", serif; background: var(--bg); color: var(--text); overflow-x: hidden; animation: pageFadeIn 0.6s ease both; }
  @keyframes pageFadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ШАПКА */
  header { position: fixed; top: 0; left: 0; right: 0; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: rgba(247,245,240,0.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 100; }
  .burger { width: 42px; height: 42px; border: none; background: transparent; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; border-radius: 6px; transition: background 0.25s var(--ease); }
  .burger:hover { background: rgba(0,0,0,0.05); }
  .burger span { display: block; width: 22px; height: 2px; background: var(--text); transition: transform 0.35s var(--ease), opacity 0.25s var(--ease); }
  .burger.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .burger.active span:nth-child(2) { opacity: 0; }
  .burger.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  .site-title { font-size: 22px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; user-select: none; color: var(--text); text-decoration: none; transition: color 0.25s var(--ease); white-space: nowrap; }
  .site-title:hover { color: var(--accent); }
  .search-btn { width: 42px; height: 42px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 6px; transition: background 0.25s var(--ease), transform 0.25s var(--ease); }
  .search-btn:hover { background: rgba(0,0,0,0.05); transform: scale(1.06); }
  .search-btn svg { width: 20px; height: 20px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; }

  /* ШТОРКА */
  .drawer { position: fixed; top: 0; left: 0; width: 320px; max-width: 88vw; height: 100%; background: #fff; box-shadow: var(--shadow); transform: translateX(-100%); transition: transform 0.4s var(--ease); z-index: 200; display: flex; flex-direction: column; padding: 90px 0 24px 0; }
  .drawer.open { transform: translateX(0); }
  .drawer nav { flex: 1; overflow-y: auto; padding-bottom: 12px; }
  .class-block { position: relative; }
  .class-btn { width: 100%; display: block; padding: 18px 32px; background: none; border: none; cursor: pointer; font-family: inherit; font-size: 18px; color: var(--text); text-align: left; position: relative; border-bottom: 1px solid var(--border); transition: color 0.3s var(--ease), padding-left 0.35s var(--ease), background 0.3s var(--ease); }
  .class-btn::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); transform: scaleY(0); transform-origin: center; transition: transform 0.35s var(--ease); }
  .class-btn:hover, .class-block.open > .class-btn { color: var(--accent); padding-left: 42px; background: var(--bg); }
  .class-btn:hover::before, .class-block.open > .class-btn::before { transform: scaleY(1); }
  .class-body { max-height: 0; overflow: hidden; background: #fbfaf7; transition: max-height 0.45s var(--ease); }
  .class-block.open > .class-body { max-height: 5000px; }
  .author-block { position: relative; }
  .author-btn { width: 100%; display: block; padding: 13px 24px 13px 46px; background: none; border: none; cursor: pointer; font-family: inherit; font-size: 16px; color: var(--muted); text-align: left; border-bottom: 1px solid rgba(0,0,0,0.04); transition: color 0.3s var(--ease), padding-left 0.35s var(--ease), background 0.3s var(--ease); }
  .author-btn::before { content: ""; position: absolute; left: 32px; top: 50%; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transform: translateY(-50%) scale(0.7); transition: background 0.3s var(--ease), transform 0.3s var(--ease); }
  .author-btn:hover, .author-block.open > .author-btn { color: var(--accent); padding-left: 54px; background: rgba(0,0,0,0.02); }
  .author-btn:hover::before, .author-block.open > .author-btn::before { background: var(--accent); transform: translateY(-50%) scale(1); }
  .author-body { max-height: 0; overflow: hidden; background: #fff; transition: max-height 0.4s var(--ease); }
  .author-block.open > .author-body { max-height: 2000px; }
  .work-link { display: block; padding: 10px 24px 10px 66px; font-size: 15px; color: var(--text); text-decoration: none; position: relative; transition: color 0.25s var(--ease), background 0.25s var(--ease), padding-left 0.3s var(--ease); }
  .work-link::before { content: ""; position: absolute; left: 50px; top: 50%; width: 6px; height: 1px; background: var(--muted); transition: width 0.3s var(--ease), background 0.3s var(--ease); }
  .work-link:hover { color: var(--accent); background: rgba(138,109,59,0.06); padding-left: 72px; }
  .work-link:hover::before { width: 12px; background: var(--accent); }
  .all-program { display: block; margin: 14px 24px 18px 32px; padding: 13px 16px; background: var(--text); color: #fff; font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; text-align: center; text-decoration: none; border-radius: 6px; transition: background 0.3s var(--ease); }
  .all-program:hover { background: var(--accent); }
  .drawer .contacts { padding: 16px 24px 0 24px; border-top: 1px solid var(--border); }
  .drawer .contacts a { display: block; text-align: center; padding: 14px; background: transparent; color: var(--text); text-decoration: none; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--border); border-radius: 6px; transition: 0.3s; }
  .drawer .contacts a:hover { background: var(--bg); color: var(--accent); border-color: var(--accent); }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); opacity: 0; visibility: hidden; transition: 0.35s; z-index: 150; backdrop-filter: blur(2px); }
  .overlay.show { opacity: 1; visibility: visible; }

  /* ПОИСК */
  .search-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-start; justify-content: center; padding-top: 100px; opacity: 0; visibility: hidden; transition: 0.3s; z-index: 300; }
  .search-modal.show { opacity: 1; visibility: visible; }
  .search-panel { width: 90%; max-width: 620px; display: flex; flex-direction: column; }
  .search-box { background: #fff; border-radius: 10px; padding: 18px 22px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); transform: translateY(-20px); transition: 0.35s; }
  .search-modal.show .search-box { transform: translateY(0); }
  .search-box svg { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; }
  .search-box input { flex: 1; border: none; outline: none; font-size: 18px; font-family: inherit; background: transparent; }
  .search-results { background: #fff; border-radius: 0 0 10px 10px; margin-top: -6px; max-height: 0; overflow: hidden; transition: 0.4s; box-shadow: var(--shadow); }
  .search-results.show { max-height: 400px; overflow-y: auto; }
  .search-result { display: block; padding: 12px 22px; text-decoration: none; color: var(--text); border-top: 1px solid var(--border); transition: 0.2s; }
  .search-result:hover { background: var(--bg); padding-left: 28px; }
  .search-result .path { font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
  .search-result .name { font-size: 16px; }
  .search-result mark { background: #f3e6c8; color: var(--accent); font-weight: 600; padding: 0 2px; border-radius: 3px; }

  /* ГЛАВНАЯ */
  main.home { min-height: 100vh; padding-top: 70px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .hero-title { font-size: clamp(40px, 9vw, 130px); font-weight: 700; letter-spacing: 4px; text-transform: uppercase; text-align: center; position: relative; z-index: 5; padding: 0 20px; animation: heroIn 1.2s var(--ease) 0.3s both; }
  @keyframes heroIn { from { opacity: 0; transform: translateY(20px); letter-spacing: 12px; } to { opacity: 1; transform: translateY(0); letter-spacing: 4px; } }
  .side-photo { position: absolute; top: 50%; width: clamp(180px, 22vw, 340px); aspect-ratio: 3 / 4; background: #d9d4c9; border-radius: 6px; overflow: hidden; box-shadow: var(--shadow); z-index: 1; }
  .side-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .side-photo.left { left: 3vw; transform: translate(-150%, -50%); animation: slideInLeft 1.2s var(--ease) 0.1s forwards; }
  .side-photo.right { right: 3vw; transform: translate(150%, -50%); animation: slideInRight 1.2s var(--ease) 0.1s forwards; }
  @keyframes slideInLeft { to { transform: translate(0, -50%); } }
  @keyframes slideInRight { to { transform: translate(0, -50%); } }

  @media (max-width: 768px) {
    .site-title { font-size: 16px; }
    .side-photo { width: 42vw; opacity: 0.85; }
    .side-photo.left { left: 2vw; } .side-photo.right { right: 2vw; }
    .hero-title { font-size: clamp(34px, 12vw, 60px); letter-spacing: 2px; }
  }
</style>

    { author: "А.П. Чехов", works: [ { title: "Лошадиная фамилия", url: "5-chekhov.html" } ] },
    { author: "М.М. Зощенко", works: [ { title: "Золотые слова", url: "5-zoshchenko.html" } ] },
    { author: "А.И. Куприн", works: [ { title: "Белый пудель", url: "5-kuprin.html" }, { title: "Тапёр", url: "5-kuprin-taper.html" } ] },
    { author: "М.М. Пришвин", works: [ { title: "Кладовая солнца", url: "5-prishvin.html" } ] },
    { author: "К.Г. Паустовский", works: [ { title: "Заячьи лапы", url: "5-paustovsky.html" } ] },
    { author: "А.П. Платонов", works: [ { title: "Никита", url: "5-platonov.html" } ] },

    { author: "Дж. Лондон", works: [ { title: "Сказание о Кише", url: "5-london.html" } ] }
  ]
};

function buildMenu() {
  const nav = document.getElementById('menuNav');
  if (!nav) return;
  Object.keys(PROGRAM).forEach(classNum => {
    const block = document.createElement('div'); block.className = 'class-block';
    const btn = document.createElement('button'); btn.className = 'class-btn'; btn.textContent = `${classNum}й класс`;
    block.appendChild(btn);
    const body = document.createElement('div'); body.className = 'class-body';
    PROGRAM[classNum].forEach(authorObj => {
      const aBlock = document.createElement('div'); aBlock.className = 'author-block';
      const aBtn = document.createElement('button'); aBtn.className = 'author-btn'; aBtn.textContent = authorObj.author;
      aBlock.appendChild(aBtn);
      const aBody = document.createElement('div'); aBody.className = 'author-body';
      authorObj.works.forEach(w => {
        const a = document.createElement('a'); a.className = 'work-link'; a.href = w.url; a.textContent = w.title;
        aBody.appendChild(a);
      });
      aBlock.appendChild(aBody); body.appendChild(aBlock);
      aBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = aBlock.classList.contains('open');
        body.querySelectorAll('.author-block').forEach(b => b.classList.remove('open'));
        if (!wasOpen) aBlock.classList.add('open');
      });
    });
    const allLink = document.createElement('a'); allLink.className = 'all-program'; allLink.href = `test.html?class=${classNum}`; allLink.textContent = 'Вся программа';
    body.appendChild(allLink);
    block.appendChild(body); nav.appendChild(block);
    btn.addEventListener('click', () => {
      const wasOpen = block.classList.contains('open');
      nav.querySelectorAll('.class-block').forEach(b => b.classList.remove('open'));
      if (!wasOpen) block.classList.add('open');
    });
  });
}

function buildSearchIndex() {
  const index = [];
  Object.keys(PROGRAM).forEach(classNum => {
    PROGRAM[classNum].forEach(authorObj => {
      authorObj.works.forEach(w => {
        index.push({ path: `${classNum}й класс · ${authorObj.author}`, name: w.title, url: w.url });
      });
    });
  });
  return index;
}
const SEARCH_INDEX = buildSearchIndex();

function runSearch(query) {
  const resultsBox = document.getElementById('searchResults'); if (!resultsBox) return;
  const q = query.trim().toLowerCase(); if (!q) { resultsBox.classList.remove('show'); resultsBox.innerHTML = ''; return; }
  const matches = SEARCH_INDEX.filter(item => item.name.toLowerCase().includes(q) || item.path.toLowerCase().includes(q)).slice(0, 20);
  if (matches.length === 0) { resultsBox.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted)">Ничего не найдено</div>`; resultsBox.classList.add('show'); return; }
  resultsBox.innerHTML = matches.map(item => `<a class="search-result" href="${item.url}"><div class="path">${item.path}</div><div class="name">${item.name}</div></a>`).join('');
  resultsBox.classList.add('show');
}

document.addEventListener('DOMContentLoaded', () => {
  buildMenu();
  const burger = document.getElementById('burger'), drawer = document.getElementById('drawer'), overlay = document.getElementById('overlay');
  const searchBtn = document.getElementById('searchBtn'), searchModal = document.getElementById('searchModal'), searchInput = document.getElementById('searchInput'), searchResults = document.getElementById('searchResults');
  
  if (burger) {
    const openDrawer = () => { drawer.classList.add('open'); overlay.classList.add('show'); burger.classList.add('active'); };
    const closeDrawer = () => { drawer.classList.remove('open'); overlay.classList.remove('show'); burger.classList.remove('active'); };
    burger.addEventListener('click', () => drawer.classList.contains('open') ? closeDrawer() : openDrawer());
    overlay.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
  }
  if (searchBtn) {
    const openSearch = () => { searchModal.classList.add('show'); setTimeout(() => searchInput.focus(), 200); };
    const closeSearch = () => { searchModal.classList.remove('show'); searchInput.value = ''; searchResults.classList.remove('show'); searchResults.innerHTML = ''; };
    searchBtn.addEventListener('click', openSearch);
    searchModal.addEventListener('click', (e) => { if (e.target === searchModal) closeSearch(); });
    searchInput.addEventListener('input', (e) => runSearch(e.target.value));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSearch(); });
  }
});
</script>
